name: ARPEGE isobars ingestion

# Calque "isobares" (Europe + monde, passé -> prévision, cf.
# PROMPT_REPRISE_ISOBARES.md à la racine du repo web). Source : Open-Meteo
# AWS Open Data (gratuit, sans clé), PAS le bucket meteofrance-pnt (celui-ci
# ne contient pas l'ARPEGE, vérifié le 23/07). `latest.json` fait foi pour
# savoir si un run est réellement complet -> déclenchement à +2h, sans
# risque si le run n'est pas encore prêt (le script retombera alors sur le
# run précédent, déjà traité, cf. sb_exists côté passé).

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"   # UTC — runs ARPEGE 00/06/12/18Z + 2h
  workflow_dispatch: {}
  # 07/09/2026 : un changement de la chaîne d'ingestion déclenche son
  # propre run — pas de `gh` ni de token sur le poste, et attendre le
  # prochain cron (jusqu'à 6 h) pour voir si le script tourne, c'est
  # trop long. `skip-if-exists` rend le run gratuit s'il n'y a rien de
  # neuf à produire.
  push:
    branches: [main]
    paths:
      - "arpege-isobars/**"
      - ".github/workflows/arpege-isobars.yml"

concurrency:
  group: arpege-isobars
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 08/09/2026 (fronts) : le run #195 — 79 échéances Monde avec les 4
    # champs 850 hPa en plus de la pression + 79 Europe — a duré 25 min
    # 32 s, contre 10 min pour le #194 sans fronts et 30 min de plafond.
    # Trop juste : un run normal recalcule toutes les échéances FUTURES
    # (67 par grille), donc ce n'est pas le seul premier run qui coûte.
    # 45 min laisse de la marge ; la lecture S3 domine (mesuré : le calcul
    # des fronts fait ~2 s par échéance), à optimiser si ça grimpe encore.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        # ⛔ 11/11/2026 — `boto3` EST DANS CETTE LIGNE, et il ne doit plus
        # en sortir. Il était installé par un SECOND `pip install` à
        # l'étape d'ingestion ci-dessous, et c'est ce qui a tué les runs
        # #408 et #409 : `s3fs` tire `aiobotocore`, qui épingle
        # `botocore<1.43.118` ; un `pip install boto3` lancé APRÈS, sans
        # contrainte, a pris botocore 1.44.0 (sorti le 10/11 à 20:22 UTC,
        # 20 min avant le #408) et `NEW_RETRIES_ENABLED` avait disparu de
        # `botocore.retries.standard` → `ImportError` au premier
        # `fsspec.open("blockcache::s3://…")`, en 3 s, avant tout octet
        # lu. En une seule ligne, le résolveur de pip arbitre les deux
        # clients S3 d'un coup (boto3 1.43.117 aujourd'hui) et reprendra
        # tout seul un boto3 plus récent dès qu'aiobotocore l'autorisera.
        #
        # ⚠️ Les autres workflows gardent leur `pip install boto3` à
        # l'étape d'ingestion sans danger : aucun n'installe `s3fs`, donc
        # aucun n'a d'aiobotocore à contredire. Ce n'est pas une
        # incohérence, c'est la seule chaîne qui lit du S3 par fsspec.
        run: pip install --quiet omfiles fsspec s3fs numpy matplotlib scipy boto3

      - name: Aucun conflit de dépendances (2 s, avant tout téléchargement)
        # ⛔ LA PANNE DU 10/11 EST PASSÉE PAR UNE ÉTAPE VERTE. `pip
        # install` ÉCRIT « ERROR: pip's dependency resolver does not
        # currently take into account all the packages that are
        # installed » puis rend 0 : l'environnement était cassé et
        # l'étape d'installation affichait un ✓. C'est exactement le faux
        # vert que ce dépôt refuse ailleurs.
        # `pip check` rend 1 sur ce conflit-là et NOMME les deux paquets ;
        # l'import de `s3fs` attrape en plus une rupture non déclarée dans
        # les métadonnées. Deux secondes, hors réseau de données.
        run: |
          pip check
          python -c "import s3fs, boto3, botocore; print(f's3fs {s3fs.__version__} / boto3 {boto3.__version__} / botocore {botocore.__version__} — cohabitation OK')"

      - name: Ingest ARPEGE isobars
        working-directory: arpege-isobars
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ── Bascule Supabase → R2, une chaîne à la fois (03/08/2026) ──
          # `STORAGE_BACKEND` est une VARIABLE de dépôt (Settings →
          # Variables), pas un secret : elle n'a rien de confidentiel et
          # on veut la voir dans l'interface. Valeurs : `supabase`
          # (défaut si vide, comportement d'avant), `r2`, ou `both`
          # (double écriture — utile seulement pour les clés horodatées
          # des isobares, cf. tools/storage.py §3).
          # Basculer CETTE chaîne = changer cette variable, rien d'autre.
          # Revenir en arrière aussi. Aucun code à toucher.
          #
          # ⚠️ Le jeton R2 doit être restreint AU SEUL bucket, en portée
          # « lecture/écriture objet » — jamais « administrateur ».
          # ⚠️ « Re-run jobs » rejoue l'ANCIEN commit : après un push,
          # utiliser « Run workflow », sinon on croit que le patch ne
          # marche pas (piège du 30/07, 798 tuiles recréées).
          # 03/08/2026 — sans ça, `print()` est bufferisé par blocs de 8 Ko
          # quand la sortie ne va pas vers un terminal : les logs du run
          # n'apparaissent qu'À LA FIN, d'un seul coup. Or le garde-fou
          # n°1 repose sur la lecture du cadre DIMENSIONNEMENT et de la
          # ligne [compteurs] — les lire APRÈS coup, sur un run qui a
          # déjà écrit, c'est se priver de la seule occasion de couper.
          PYTHONUNBUFFERED: "1"
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND_ISOBARS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET_ISOBARS }}
        run: python ingest.py
