name: AGRUME — colonnes aux balises (produit A) + grille 3D (produit B)

# ══════════════════════════════════════════════════════════════════════
#  ⚠️ QUI DÉCIDE QUAND, ET QUI FAIT LE TRAVAIL — ce n'est pas le même.
#
#  Le VPS DÉCIDE : `bw-agrume-poller-paquets` guette les quatre paquets
#  du produit A sur le miroir S3 et déclenche ce workflow (`--dispatch`)
#  dès qu'ils sont TOUS publiés. C'est sa seule propriété unique : il est
#  allumé en permanence, une Action ne l'est pas. Un cron calé sur une
#  heure fixe part soit trop tôt (404) soit trop tard (fraîcheur perdue),
#  et la doc Météo-France se contredit elle-même sur ces heures.
#
#  L'ACTION FAIT LE TRAVAIL : ~7,4 Go de GRIB téléchargés et décodés par
#  run. Sur le VPS ce serait le mauvais endroit — 2 vCores partagés avec
#  `collect` et `score`, 40 Go de disque, et 23 Go/jour de trafic. Ici
#  c'est gratuit et sans limite de minutes (dépôt public, confirmé par le
#  changelog GitHub du 16/12/2025), avec 4 vCores et 14 Go de disque
#  éphémère. **Le VPS ne touche jamais un GRIB.**
#
#  ── LE CRON N'EST QU'UN FILET ────────────────────────────────────────
#  Il est calé TARD volontairement : si le poller du VPS a fait son
#  travail, le run est déjà archivé et l'ingestion le reverra simplement
#  comme déjà couvert. Le filet existe pour qu'une panne du VPS ne laisse
#  pas de TROU dans l'archive. ⚠️ 13/08 : l'archive n'est plus définitive
#  (rétention glissante 7 j) mais un trou coûte AUTANT — c'est une
#  journée que le scoring ne notera jamais, et les scores sont éternels. ⚠️ Écrire deux fois
#  le même run est sans danger : la clé porte le run, donc on réécrit le
#  même objet au même endroit.
#
#  ── DEUX PRODUITS, UNE SEULE PASSE (étape 6, 10/08) ──────────────────
#  Le produit B (grille 3D du domaine, 61 × 85) se découpe dans les
#  MÊMES messages, déjà téléchargés et déjà décodés pour le produit A.
#  Il ne coûte donc ni octet de réseau ni minute de runner — seulement du
#  stockage, et il ne garde que ses trois derniers runs.
#  ⚠️ L'ordre est un contrat : le produit A, DÉFINITIF, s'écrit d'abord ;
#  le produit B ensuite, sous filet. Un échec de la grille laisse le run
#  VERT — faire tomber le voyant pour un produit régénéré au réseau
#  suivant apprendrait à l'ignorer.
#
#  ── CE QUE CE RUN NE FAIT PAS ────────────────────────────────────────
#  Il ne régénère NI l'orographie NI l'axe des balises. Les deux sont des
#  artefacts commités (`agrume/data/`), et c'est le point : un socle qui
#  se régénère tout seul n'est plus un socle. Ils changent dans un
#  commit, à la main, ou pas du tout.
# ══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      run:
        description: "Run AROME visé (ex. 2026-08-10T09:00:00Z) — indicatif, l'ingestion revérifie la couverture réelle"
        required: false
        type: string
      max_heures:
        description: "Horizon en heures (défaut 24)"
        required: false
        default: "24"
        type: string
  schedule:
    # Filet de sécurité : le chemin normal reste le dispatch du VPS.
    #
    # ⛔ DÉCALÉ DE H+2 h 20 À H+4 h 20 LE 14/08, et ce n'est pas
    # cosmétique. À H+2 h 20, ce filet retombait TOUJOURS sur le réseau
    # PRÉCÉDENT (le réseau H n'est publié qu'à partir de H+2 h 50), et
    # il le republiait à l'identique — un run entier de 21 Go pour
    # réécrire ce que le guet avait déjà écrit. À H+4 h 20 il attrape le
    # réseau H lui-même, rallonge 25→51 h comprise (0–24 h prêt entre
    # H+2 h 51 et H+5 h 26, rallonge entre H+2 h 52 et H+7 h 29, mesuré
    # sur douze réseaux les 12 et 13/08).
    #
    # ⚠️ Et s'il tombe sur un réseau pas encore publié, `choisir_run()`
    # se rabat sur le précédent — qui, lui, est complet ET rallongé. Le
    # filet ne peut donc pas faire PIRE qu'avant, seulement mieux.
    - cron: "20 4,7,10,13,16,19,22,1 * * *"   # UTC

concurrency:
  # ⚠️ `cancel-in-progress: false` : un run d'ingestion écrit une archive
  # DÉFINITIVE. L'annuler à mi-parcours laisserait un objet partiel sur
  # R2 — pire qu'un run manquant, parce que ça ressemble à un run réussi.
  group: agrume-colonnes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Budget MESURÉ : 2,9 min sur 0–6 h, ~9 min extrapolées sur 0–24 h.
    # Le script alerte lui-même au-delà de 30 min (la moitié du timeout).
    # Les 60 min ne sont donc pas une contrainte, c'est une ceinture.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer eccodes et numpy
        run: pip install --quiet eccodes eccodeslib numpy boto3

      - name: Vérifier les artefacts figés AVANT de télécharger 7 Go
        # ⚠️ Le sha256 des deux orographies est revérifié ici, et l'axe
        # des balises est relu. Si l'un des deux est corrompu ou figé sur
        # un autre domaine, on le sait en deux secondes plutôt qu'après
        # sept gigaoctets et neuf minutes.
        run: |
          python3 agrume/freeze_orographie.py --verifier
          python3 agrume/freeze_balises.py --verifier

      - name: Bancs hors-ligne
        # Trois secondes, aucun réseau. Ils attrapent ce qui casse en
        # silence : deux fois la même orographie, une grille déplacée,
        # une température quantifiée en kelvins, un trou à 10 m.
        run: |
          python3 tools/test_mf_s3.py
          python3 agrume/test_orographie.py
          python3 verif/test_colonnes.py
          # ⛔ Lot J (13/08). Deux bancs qui gardent une COUPE, pas un
          # calcul : `test_separation` refuse toute nouvelle flèche
          # `agrume/` → `verif/` (une séparation ne se maintient pas
          # toute seule — six mois plus tard un import la défait sans
          # qu'aucun écran ne change) ; `test_purge` rejoue la
          # rétention glissante sur un faux backend, AVEC des trous
          # d'ingestion et une panne de deux jours, et se prouve
          # capable d'échouer en se rejouant contre la purge naïve
          # qu'on a écartée.
          python3 verif/test_separation.py
          python3 verif/test_purge.py
          # ⚠️ Lot M (13/08). Hors-ligne : le calcul du run depuis
          # l'échéance fixe, l'idempotence du journal, et le
          # court-circuit d'une station inactive AVANT tout réseau.
          # Le timer VPS qui l'utilise n'est PAS testé ici (il lit R2
          # et Wyoming en vrai) — seule sa logique pure l'est.
          python3 verif/test_confronter_quotidien.py
          python3 agrume/test_grille.py
          # ⚠️ Ces trois-là ne protègent PAS l'ingestion : ils protègent
          # la LECTURE (profil, coupe, confrontation au ballon). Ils sont
          # quand même ici parce que ce dépôt n'a pas d'autre CI, et
          # qu'un banc qu'on ne lance jamais cesse de protéger quoi que
          # ce soit. Le 10/08, `profil.py` a été refactoré et rien
          # n'aurait rejoué son banc automatiquement.
          python3 agrume/test_profil.py
          python3 agrume/test_radiosondage.py
          python3 agrume/test_transect.py
          # ⚠️ Celui-ci ne protège pas non plus l'ingestion faite ICI : il
          # protège l'ingestion AROME-PI, qui tourne sur le VPS (étape
          # 8 bis). Il est quand même dans cette liste parce que c'est la
          # SEULE CI du dépôt — et qu'un banc qu'on ne lance jamais cesse
          # de protéger quoi que ce soit. Il est hors-ligne et sans clé.
          python3 agrume/test_ingest_pi.py
          # Étape 9. ⚠️ Sa vérification centrale est un INVARIANT :
          # aux niveaux communs et tant que w_PI = 1, le composite
          # reproduit PI exactement. Un composite qui dérive de PI a
          # inventé une valeur là où PI en donnait une — et ça ne se
          # voit sur aucune courbe.
          python3 agrume/test_composite.py
          # ⚠️ Étape 11 (12/08). `test_freeze_balises` existe à cause d'une
          # panne : la clé du manifeste d'axe est passée de `domaine` à
          # `domaines` avec les Pyrénées, `charger_artefact` a été rendu
          # tolérant aux deux formes — et le `print` de `--verifier`, dix
          # lignes plus bas, est resté au singulier. KeyError en
          # production, sur un artefact parfaitement valide, dans une
          # vérification qui ne vérifiait plus rien. Ce fichier n'avait
          # AUCUN banc ; il en a un, et il rejoue exactement ce chemin.
          python3 agrume/test_freeze_balises.py
          # Étape 11. ⚠️ Un calque interpolé de travers reste lisse,
          # coloré et plausible : aucun contrôle visuel ne le démasque.
          # L'invariant est le seul qui ne dépende pas de l'œil — aux
          # altitudes tombant sur un niveau, le calque doit rendre le
          # niveau BRUT, à l'octet près.
          python3 agrume/test_calque.py
          # Étape 12 bis. Le front d'altitude a un banc depuis le 10/08 et
          # n'était jamais entré dans cette liste — un banc qu'on ne lance
          # pas cesse de protéger quoi que ce soit, c'est écrit trois fois
          # plus haut et ça restait vrai pour celui-là.
          python3 agrume/test_front_altitude.py
          # ⛔⛔ 27/08 — LES BANCS DE LA NUIT DU 26 AU 27, ET TROIS
          # ORPHELINS QUI TRAÎNAIENT.
          #
          # `test_portail.py` est NEUF : ce module n'avait aucun banc, et
          # c'est lui qui a laissé passer un corps d'erreur HTTP 200 dans
          # eccodes trois nuits de suite. Il rejoue le corps exact du
          # journal du VPS.
          #
          # `test-voyant-piaf.sh` est NEUF aussi et n'est pas en Python :
          # ce qui a rempli la boîte de Yann n'était pas un calcul, c'est
          # un `case` de shell qui pinguait `/fail` dès la première passe
          # perdue. Le banc s'écrit donc là où vit la faute.
          #
          # ⚠️ Et `test_piaf`, `test_poller`, `test_rafraichissement`
          # existaient depuis le 20/08 sans JAMAIS entrer dans cette
          # liste. Trois secondes à eux trois, hors-ligne et sans clé —
          # ils n'avaient aucune raison d'en être absents, sinon qu'on a
          # oublié de les y mettre. C'est écrit quatre fois plus haut :
          # un banc qu'on ne lance jamais cesse de protéger quoi que ce
          # soit.
          python3 agrume/test_portail.py
          bash    agrume/test-voyant-piaf.sh
          python3 agrume/test_piaf.py
          python3 agrume/test_poller.py
          python3 agrume/test_rafraichissement.py
      # ══════════════════════════════════════════════════════════════
      #  ⛔⛔ LE BANC DE PARITÉ Python ↔ TypeScript (13/08 → câblé ce jour)
      #
      #  Le mélange des deux verticales (étape 13) est écrit DEUX FOIS,
      #  une fois ici en Python et une fois dans le front en TypeScript.
      #  Deux rampes qui divergent ne lèvent rien — elles rendent une
      #  carte lisse, une coupe lisse, et deux vents différents au même
      #  point. C'est resté hors CI depuis le 12/08 : il charge
      #  `PWA/web/src/lib/altitudeLayer.ts` et `agrumeProfile.ts`, qui
      #  vivent dans `biozarb/balise-watch` — un dépôt PRIVÉ que le
      #  `GITHUB_TOKEN` de CE dépôt ne peut pas atteindre.
      #  ⚠️ Le préfixe `PWA/` n'est PAS cosmétique : depuis
      #  `PWA/balise-watch-server/tools/`, le banc local voit ces
      #  fichiers en `../../web/src/lib/…` — et c'est ce chemin-là,
      #  amputé de `PWA/`, qui a été recopié ici le 13/08. Un
      #  sparse-checkout sur un motif qui ne correspond à rien reste
      #  VERT (runs #62 et #63).
      #
      #  ⛔ PAS DE VERSION « QUI SAUTE SI LE SECRET EST ABSENT ». Le
      #  `checkout` ci-dessous n'a AUCUNE garde conditionnelle : si
      #  `WEB_REPO_PAT` manque ou est expiré, cette étape ÉCHOUE, point.
      #  Un banc qui se saute tout seul en CI est exactement le faux vert
      #  que ce fichier passe son temps à refuser.
      #
      #  ⛔⛔ ACTION YANN, si ce n'est pas déjà fait : créer un PAT
      #  fine-grained sur `biozarb/balise-watch`, droit `Contents: Read`
      #  SEUL (rien d'écriture), et le déposer dans CE dépôt
      #  (balise-watch-server) → Settings → Secrets and variables →
      #  Actions → `WEB_REPO_PAT`. Sans ça, cette étape échoue avec un
      #  404 de checkout — c'est le comportement voulu, pas une panne.
      - name: Checkout du dépôt web privé (pour la parité seulement)
        uses: actions/checkout@v5
        with:
          repository: biozarb/balise-watch
          token: ${{ secrets.WEB_REPO_PAT }}
          path: _web-repo-parite
          sparse-checkout: |
            PWA/web/src/lib/altitudeLayer.ts
            PWA/web/src/lib/agrumeProfile.ts
            PWA/web/src/lib/rafraichissement.ts
            PWA/web/src/lib/piaf.ts
            PWA/web/src/lib/agrumeCache.ts
          sparse-checkout-cone-mode: false

      # ══════════════════════════════════════════════════════════════
      #  ⛔ 13/08 — UN SPARSE-CHECKOUT QUI NE TROUVE RIEN RESTE VERT.
      #
      #  Les deux chemins ci-dessus étaient `web/src/lib/…` : c'est le
      #  chemin vu depuis `PWA/`, pas depuis la RACINE du dépôt web (les
      #  fichiers y vivent sous `PWA/web/…`). Le motif ne correspondait à
      #  aucun fichier — et `actions/checkout` a rendu un arbre VIDE en
      #  1 s, en vert, sans un mot. La panne n'est apparue que deux
      #  étapes plus loin, en `ERR_MODULE_NOT_FOUND` de Node : runs #62
      #  et #63 du 13/08.
      #
      #  Cette étape existe pour que ce silence-là ne se reproduise pas :
      #  le motif se prouve, à l'endroit où il est écrit.
      # ══════════════════════════════════════════════════════════════
      - name: Le sparse-checkout a bien ramené les cinq fichiers
        run: |
          manque=0
          for f in _web-repo-parite/PWA/web/src/lib/altitudeLayer.ts \
                   _web-repo-parite/PWA/web/src/lib/agrumeProfile.ts \
                   _web-repo-parite/PWA/web/src/lib/rafraichissement.ts \
                   _web-repo-parite/PWA/web/src/lib/piaf.ts \
                   _web-repo-parite/PWA/web/src/lib/agrumeCache.ts; do
            if [ -s "$f" ]; then
              echo "✓ $f ($(wc -c < "$f") o)"
            else
              echo "✗ ABSENT OU VIDE : $f"
              manque=1
            fi
          done
          if [ "$manque" = "1" ]; then
            echo "──────────────────────────────────────────────────────"
            echo "Le checkout du dépôt web est VERT mais n'a rien ramené."
            echo "C'est un motif sparse-checkout qui ne correspond à"
            echo "aucun fichier — vérifier les chemins ci-dessus contre"
            echo "l'arborescence RÉELLE de biozarb/balise-watch."
            echo "Contenu effectivement ramené :"
            find _web-repo-parite -type f | head -40
            exit 1
          fi

      # ══════════════════════════════════════════════════════════════
      #  ⛔ 25/08 — LA LISTE ÉTAIT JUSTE, ELLE EST DEVENUE INCOMPLÈTE.
      #
      #  Le contrôle ci-dessus prouve que les fichiers DEMANDÉS sont là.
      #  Il ne peut pas savoir qu'`agrumeProfile.ts` s'est mis, côté web,
      #  à importer un cinquième module (`agrumeCache.ts`, lot perf du
      #  25/08) : la liste sparse est écrite ICI et le graphe d'imports
      #  vit LÀ-BAS. Trois runs de suite (#346-#348) sont morts en
      #  `ERR_MODULE_NOT_FOUND`, et comme la parité passe AVANT
      #  l'ingestion, aucun n'a écrit un octet d'archive.
      #
      #  Cette étape ferme la boucle : elle relit le graphe RÉELLEMENT
      #  ramené et exige que chaque import de valeur relatif tombe sur un
      #  fichier présent. La prochaine fois, le rouge tombe ici — à
      #  l'endroit où la liste s'écrit, avec le nom du fichier à ajouter.
      #
      #  ⚠️ Les imports `import type … from './x.ts'` sont RETIRÉS avant
      #  l'examen : `--experimental-strip-types` les efface, ils
      #  n'exigent aucun fichier à l'exécution. Les exiger quand même
      #  ferait rougir la CI pour un fichier dont personne n'a besoin.
      # ══════════════════════════════════════════════════════════════
      - name: Aucun import relatif ne pointe hors du sparse-checkout
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          racine = pathlib.Path('_web-repo-parite/PWA/web/src/lib')
          fichiers = sorted(racine.glob('*.ts'))
          manque = []
          for f in fichiers:
              src = f.read_text(encoding='utf-8')
              src = re.sub(r"import\s+type\s[\s\S]*?from\s*['\"][^'\"]+['\"]",
                           '', src)
              for spec in re.findall(r"from\s*['\"](\.[^'\"]+)['\"]", src):
                  cible = (f.parent / spec)
                  etat = 'ok' if cible.is_file() else 'ABSENT'
                  print(f"  {f.name} → {spec} : {etat}")
                  if etat == 'ABSENT':
                      manque.append((f.name, spec))

          if manque:
              print('─' * 54)
              print("Un module ramené en importe un qui ne l'a pas été.")
              print("Le graphe d'imports du dépôt web a bougé ; la liste")
              print("`sparse-checkout` de CE fichier ne l'a pas suivi.")
              print("À ajouter sous `PWA/web/src/lib/` :")
              for nom, spec in manque:
                  print(f"  {spec.lstrip('./')}   (importé par {nom})")
              sys.exit(1)
          print(f"{len(fichiers)} fichier(s) examiné(s), graphe complet.")
          PY

      - uses: actions/setup-node@v4
        with:
          # ⚠️ PAS `.nvmrc` (il pointe sur 20, pour le front) :
          # `--experimental-strip-types` exige Node ≥ 22.6. Concerne
          # UNIQUEMENT ce job de bench, pas le reste du dépôt.
          node-version: "22"

      - name: Banc de parité Python ↔ TypeScript
        run: |
          python3 agrume/banc_parite.py --sortie /tmp/bw-parite
          node --experimental-strip-types tools/altitude-layer-selftest.mjs \
            --fixture /tmp/bw-parite/fixture.json \
            --tampon  /tmp/bw-parite/e01.bin \
            --zsol    /tmp/bw-parite/zsol.bin \
            --manifeste /tmp/bw-parite/manifest.json \
            --colonnes  /tmp/bw-parite/colonnes.bin
        env:
          BW_LAYER_MODULE: ${{ github.workspace }}/_web-repo-parite/PWA/web/src/lib/altitudeLayer.ts
          BW_AGRUME_MODULE: ${{ github.workspace }}/_web-repo-parite/PWA/web/src/lib/agrumeProfile.ts
          # ⚠️ Le banc charge `agrumeCache.ts` LUI-MÊME, pour purger entre
          # deux scénarios des caches qui vivent au niveau du MODULE.
          # Sans ce chemin il retomberait sur son défaut
          # `../../web/src/lib/…` — l'arborescence du Mac de Yann, qui
          # n'existe pas sur le runner : `ERR_MODULE_NOT_FOUND`, cette
          # fois levé par le banc lui-même.
          BW_CACHE_MODULE: ${{ github.workspace }}/_web-repo-parite/PWA/web/src/lib/agrumeCache.ts

      # ⛔ LE BANC DU RAFRAÎCHISSEMENT CÔTÉ CLIENT (Lot L3a, 17/08).
      # Hors ligne, sans clé : il vérifie que le client cherche l'échéance
      # par INSTANTS (la faute que le Lot L2 a trouvée dans son propre
      # cahier des charges le matin même), qu'il lit les offsets comme
      # RELATIFS au bloc, qu'il refuse une grille aux axes voisins et
      # qu'il n'affirme jamais « PI » sur une échéance à poids nul.
      # ⚠️ `--production` n'est PAS ajouté ici : un banc de CI qui dépend
      # de ce qui est en ligne à cet instant est un banc qui rougit pour
      # une raison qui n'est pas la sienne.
      - name: Banc du rafraîchissement PI, côté client
        run: |
          node --experimental-strip-types \
            tools/rafraichissement-client-selftest.mjs
        env:
          BW_RAF_MODULE: ${{ github.workspace }}/_web-repo-parite/PWA/web/src/lib/rafraichissement.ts

      # ⛔ LE BANC DE LA PLUIE À VENIR, CÔTÉ CLIENT (Lot Q3, 20/08).
      # Hors ligne, sans clé. Il tient six façons de mentir sans erreur :
      # l'instant nommé pris pour le DÉBUT de la tranche, la latitude lue
      # comme croissante, l'indice de maille arrondi au lieu d'être
      # tronqué, un manifeste servi pour les octets d'une autre passe,
      # une grille au compte IMPAIR, et l'échéance de BORD rendue au lieu
      # d'un refus.
      # ⚠️ C'est ce banc qui a trouvé, le jour de son écriture, que
      # `(50,01 − 46,45) / 0,02` rend 177 et non 178 — la pluie peinte
      # 2 km trop au nord sur les lignes de frontière de bloc, sans
      # qu'aucune requête n'échoue (BUGS.md 20/08).
      # ⚠️ `--production` n'est PAS ajouté ici, même raison que ci-dessus.
      - name: Banc de la pluie à venir, côté client
        run: |
          node --experimental-strip-types \
            tools/piaf-client-selftest.mjs
        env:
          BW_PIAF_MODULE: ${{ github.workspace }}/_web-repo-parite/PWA/web/src/lib/piaf.ts

      - name: Ingérer les colonnes
        env:
          # Sans ça, `print()` est bufferisé par blocs de 8 Ko quand la
          # sortie ne va pas vers un terminal : les logs n'apparaissent
          # qu'À LA FIN, d'un coup. Or le cadre DIMENSIONNEMENT est le
          # garde-fou qui permet de COUPER avant d'écrire — le lire après
          # coup, sur un run qui a déjà écrit, ne sert à rien.
          PYTHONUNBUFFERED: "1"
          # ⚠️ AGRUME écrit sur R2 uniquement. Pas de Supabase : le quota
          # Storage y a déjà cassé le projet le 30/07, et cette archive
          # CROÎT par construction.
          STORAGE_BACKEND: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET_WIND }}
        run: |
          # ⛔ A11 (17/08) — `inputs.run` est enfin TRANSMIS. Il était
          # documenté « indicatif, l'ingestion revérifie la couverture
          # réelle » ; il était en réalité JETÉ, donc l'écart entre le run
          # que le guet croyait publié et celui qui l'était vraiment ne
          # pouvait pas être mesuré, même en le voulant.
          # ⚠️ Il ne DÉCIDE toujours rien : `choisir_run()` tranche seul,
          # sur la couverture en échéances. Il sert à COMPTER — arbitrage
          # de Yann : « on ne change rien et on compte ».
          python3 agrume/ingest_colonnes.py \
            --max-heures "${{ inputs.max_heures || '24' }}" \
            --run-vise "${{ inputs.run || '' }}" \
            --sortie "$RUNNER_TEMP/agrume"

      - name: Disque restant après le run
        # ⚠️ Le critère d'acceptation du lot exige que le disque du runner
        # ne dépasse jamais 10 Go occupés. Le script journalise son PIC ;
        # cette ligne dit ce qu'il RESTE, ce qui n'est pas la même chose
        # et se lit d'un coup d'œil dans les logs.
        if: always()
        run: df -h / | tail -1

      # ══════════════════════════════════════════════════════════════
      #  ⚠️ LE VOYANT NE SURVEILLE PAS « L'ARCHIVE GROSSIT », IL
      #     SURVEILLE « LE CHEMIN FRAIS EST VIVANT ».
      #
      #  On ne ping QUE sur `workflow_dispatch`, c'est-à-dire quand le
      #  guet du VPS a déclenché. Le cron du workflow, lui, est un FILET :
      #  s'il tourne seul, l'archive se remplit quand même — mais on a
      #  perdu les 20 à 40 minutes de fraîcheur que le guet apporte, et
      #  personne ne s'en apercevrait. Pinger sur les deux garderait le
      #  voyant au vert pendant que le jeton GitHub est expiré depuis
      #  trois semaines. Ce serait un faux vert, et le projet en a déjà
      #  eu deux (quotas du 30/07, découverts par un mail du fournisseur).
      #
      #  Ce voyant s'allume donc en rouge dans DEUX cas, tous deux
      #  légitimes : plus rien ne tourne du tout, ou le VPS ne déclenche
      #  plus. Le second se lit aussi dans l'onglet Actions — colonne
      #  « Event » : si elle ne dit plus que `schedule`, le guet est mort.
      #
      #  Réglage conseillé du check : période 3 h (AROME sort 8 fois par
      #  jour), grâce 3 h — donc alerte après ~6 h de silence, soit deux
      #  réseaux manqués. Assez lâche pour ne pas crier sur un run tardif,
      #  assez serré pour ne pas laisser passer une demi-journée.
      #
      #  ⚠️ L'URL de ping contient un UUID qui suffit à SIMULER un succès.
      #  Elle vit dans les secrets du dépôt (Settings → Secrets and
      #  variables → Actions → `HEALTHCHECK_AGRUME_URL`), jamais dans le
      #  code, jamais dans un log.
      # ══════════════════════════════════════════════════════════════
      - name: Voyant healthchecks — succès
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          HC: ${{ secrets.HEALTHCHECK_AGRUME_URL }}
        run: |
          if [ -z "$HC" ]; then
            echo "⚠️ HEALTHCHECK_AGRUME_URL absent — AUCUNE surveillance."
            echo "   Le run a réussi, mais rien ne le saura si le suivant échoue."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC"
          echo "voyant : ping de succès envoyé"

      - name: Voyant healthchecks — échec
        # ⚠️ `failure()` seulement : un run ANNULÉ n'est pas un échec de la
        # chaîne, c'est une décision humaine. Le signaler en rouge
        # apprendrait à ignorer le voyant, ce qui est pire que pas de
        # voyant du tout.
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          HC: ${{ secrets.HEALTHCHECK_AGRUME_URL }}
        run: |
          [ -n "$HC" ] || exit 0
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC/fail" || true
          echo "voyant : ping d'échec envoyé"
