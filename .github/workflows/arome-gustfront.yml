name: AROME gust-front grid ingestion

# Veille modèle « front de rafales » (Lot A) — ingère les paquets GRIB
# AROME SP1 (10u/10v, 2t, composantes de rafale) et SP2 (pression,
# CAPE, précipitations) en grille 001, sous-échantillonne à 0,25° et
# publie UN fichier JSON dans Supabase Storage sous
# `wind-grid/arome/gustfront/grid.json`.
#
# Workflow SÉPARÉ de arome-wind et arome-thermal, pour la même raison
# qu'eux : il ne doit jamais faire échouer ni retarder l'ingestion du
# vent, qui est la fonctionnalité principale.
#
# Volume mesuré (31/07/2026, run 06Z) : ~4 s par échéance, 24 échéances,
# sortie ~1,6 Mo. D'où le timeout à 20 min, largement dimensionné.
#
# ⚠️ Aucune clé Météo-France ici : le bucket AROME est en accès public.
# METEOFRANCE_API_KEY ne couvre que les observations et la vigilance.

on:
  schedule:
    # UTC, 25 min après le job vent — les paquets SP1/SP2 sont publiés
    # progressivement, partir trop tôt donne un run tronqué (cf. le
    # débogage pick_run du 25/07/2026 sur arome-wind).
    - cron: "25 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch: {}

concurrency:
  group: arome-gustfront
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install eccodes
        run: pip install --quiet eccodes eccodeslib
      - name: Ingest AROME gust-front grid
        working-directory: arome-gustfront
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # ── Bascule Supabase → R2, une chaîne à la fois (03/08/2026) ──
          # `STORAGE_BACKEND` est une VARIABLE de dépôt (Settings →
          # Variables), pas un secret : elle n'a rien de confidentiel et
          # on veut la voir dans l'interface. Valeurs : `supabase`
          # (défaut si vide, comportement d'avant), `r2`, ou `both`
          # (double écriture — utile seulement pour les clés horodatées
          # des isobares, cf. tools/storage.py §3).
          # Basculer CETTE chaîne = changer cette variable, rien d'autre.
          # Revenir en arrière aussi. Aucun code à toucher.
          #
          # ⚠️ Le jeton R2 doit être restreint AU SEUL bucket, en portée
          # « lecture/écriture objet » — jamais « administrateur ».
          # ⚠️ « Re-run jobs » rejoue l'ANCIEN commit : après un push,
          # utiliser « Run workflow », sinon on croit que le patch ne
          # marche pas (piège du 30/07, 798 tuiles recréées).
          # 03/08/2026 — sans ça, `print()` est bufferisé par blocs de 8 Ko
          # quand la sortie ne va pas vers un terminal : les logs du run
          # n'apparaissent qu'À LA FIN, d'un seul coup. Or le garde-fou
          # n°1 repose sur la lecture du cadre DIMENSIONNEMENT et de la
          # ligne [compteurs] — les lire APRÈS coup, sur un run qui a
          # déjà écrit, c'est se priver de la seule occasion de couper.
          PYTHONUNBUFFERED: "1"
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND_GUSTFRONT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET_GUSTFRONT }}
        run: |
          pip install --quiet boto3
          python ingest.py
