# Lot S3, 23/08/2026 — remonte le chien de garde AVANT la notation du
# 25/08, la premiere a lire le flux du groupe reduit (17 268 -> ~31 928
# lignes ; le run durait 810 s le 23/08).
#
# ⛔ LES DEUX LIGNES VONT ENSEMBLE, ET « Environment » N EST PAS UN
# CONFORT : run.sh lit MAX_MINUTES a sa ligne 222 et ne source
# ~/.balise-watch-model-verif.env qu a la ligne 310. Une valeur posee
# dans le .env serait INERTE — et elle aurait l air de marcher.
#
# TimeoutStartSec reste AU-DESSUS du chien de garde interne :
# on veut que ce soit run.sh qui constate l echec et alerte, jamais
# systemd qui tue tout sans que personne ne l apprenne.
#
# ⛔ 03/09/2026 — 40 -> 65 min, ET C EST UNE MESURE, PAS UN CONFORT.
# La nuit du 03/09 est morte a 2 400 s (code 124) PENDANT l upsert
# final de model_score_zone : 29 secondes trop tard. Le rejeu de la
# veille avait pris 2 257 s. Le run s allonge chaque nuit avec la
# fenetre rolling15 qui se remplit des balises etendues (L7,
# arome_r2 ~2 470) : rejeu d archive 668 200 -> 732 036 balise-jours
# en une nuit, fenetre glissante 12 -> 14 min, evenements 9 -> 10 min.
# Le plateau est attendu vers le 12/09 (fenetre pleine) ; 65 min
# laisse ~25 min de marge sur cette pente, et le pic memoire (2 006 Mo
# au jalon regime, 2 800 au seuil) reste le garde qui compte.
# Rien d autre ne tourne entre 05:57 et 07:00 CEST sauf l entretien
# (06:30) et la jauge R2 (06:33), tous deux legers.
[Service]
Environment=BW_MODEL_VERIF_MAX_MINUTES=65
TimeoutStartSec=75min
