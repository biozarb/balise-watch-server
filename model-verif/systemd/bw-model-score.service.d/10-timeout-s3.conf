# Lot S3, 23/08/2026 — remonte le chien de garde AVANT la notation du
# 25/08, la premiere a lire le flux du groupe reduit (17 268 -> ~31 928
# lignes ; le run durait 810 s le 23/08).
#
# ⛔ LES DEUX LIGNES VONT ENSEMBLE, ET « Environment » N EST PAS UN
# CONFORT : run.sh lit MAX_MINUTES a sa ligne 222 et ne source
# ~/.balise-watch-model-verif.env qu a la ligne 310. Une valeur posee
# dans le .env serait INERTE — et elle aurait l air de marcher.
#
# TimeoutStartSec (50) reste AU-DESSUS du chien de garde interne (40) :
# on veut que ce soit run.sh qui constate l echec et alerte, jamais
# systemd qui tue tout sans que personne ne l apprenne.
[Service]
Environment=BW_MODEL_VERIF_MAX_MINUTES=40
TimeoutStartSec=50min
