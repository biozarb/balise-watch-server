# ══════════════════════════════════════════════════════════════════════
#  20-oom.conf — CHOISIR LA VICTIME               (28/08/2026, post-OOM)
#
#  ⛔ CE QUI S EST PASSÉ LE 28/08 À 06:20:40, mesuré dans le journal du
#  noyau : la notation tenait 2,82 Go (anon-rss) quand
#  `bw-agrume-piaf.service` a démarré sa passe des 10 minutes et réclamé
#  la page de trop. Sur 3,73 Go utilisables et SANS SWAP, le noyau a
#  choisi le plus gros — la notation — et la nuit entière a été perdue :
#  ni L2, ni L3, ni L7 n a publié un seul objet.
#
#  ⚠️ LE NOYAU CHOISIT LE PLUS GROS, PAS LE MOINS CHER. C est
#  exactement l inverse de ce qu on veut ici, et le prix des deux
#  processus n est pas comparable :
#    · la notation tourne UNE FOIS PAR JOUR sur une archive qui ne se
#      rejoue qu à la main. La perdre coûte une journée de scores.
#    · la passe piaf tourne TOUTES LES 10 MINUTES, `Persistent=false`,
#      et ne publie qu une fois son ruban complet (cf. `ingest_piaf`,
#      « publier un ruban troué ferait un blanc »). La perdre coûte
#      dix minutes de fraîcheur sur la pluie à venir, et rien d autre.
#
#  ⓘ −500 n est pas une immunité : c est un rang. Si la notation devient
#  À ELLE SEULE plus grosse que la mémoire de la machine, elle mourra
#  quand même — et c est bien ainsi. Le swap de 4 Go posé le même jour
#  est le second filet ; celui-ci ne fait que désigner qui tombe en
#  premier quand deux jobs légitimes se croisent.
# ══════════════════════════════════════════════════════════════════════
[Service]
OOMScoreAdjust=-500
